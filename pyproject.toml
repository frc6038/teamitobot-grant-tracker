[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "itobot-grant-tracker"
version = "0.2.0"
description = "FIRST Robotics hibe fırsatlarını takip eden Telegram botu"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests==2.31.0",
    "beautifulsoup4==4.12.2",
    "python-telegram-bot==21.7",
    "sqlalchemy==2.0.52",
    "python-dotenv==1.0.0",
    "pytz==2023.3.post1",
    "psycopg2-binary==2.9.12",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
]
dev = [
    "itobot-grant-tracker[test]",
    "ruff==0.16.5",
]

[tool.setuptools]
py-modules = ["bot", "config", "database", "scraper", "smtp_notifier"]

[tool.setuptools.packages.find]
include = ["domain*", "adapters*", "infrastructure*", "tools*"]
